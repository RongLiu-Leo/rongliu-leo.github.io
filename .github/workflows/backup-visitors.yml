name: Back up visitor data

# Keeps a plain-SQL copy of the D1 database in this repository, so the visitor
# history survives even if the Cloudflare account or its free tier goes away.

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        working-directory: worker
        run: npm ci --no-audit --no-fund

      - name: Export database
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p ../data
          npx wrangler d1 export visitor-map --remote --skip-confirmation --output ../data/visitors.sql

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/visitors.sql; then
            echo "No new visits since the last backup."
            exit 0
          fi
          git add data/visitors.sql
          git commit -m "Back up visitor data ($(date -u +%Y-%m-%d))"
          git push
